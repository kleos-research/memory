name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-docs-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python build_site.py --output .site --public-docs --release-metadata public-docs-release.json
      - run: python verify_site.py .site --mode public_docs
      - name: Check in the exact reviewed Pages artifact
        run: diff --brief --recursive .site docs
      - name: Production must require immutable release metadata
        run: |
          if python build_site.py --output .production-without-release --production; then
            echo "production build unexpectedly accepted missing release metadata" >&2
            exit 1
          fi
      - name: Public docs must require immutable release metadata
        run: |
          if python build_site.py --output .public-docs-without-release --public-docs; then
            echo "public docs build unexpectedly accepted missing release metadata" >&2
            exit 1
          fi
